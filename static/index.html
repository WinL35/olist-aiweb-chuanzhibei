<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olist 经营分析与智能选品平台</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/vendor/vue.global.prod.js"></script>
  <script src="/assets/vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="logo">📊 Olist<br/>经营分析平台</div>
      <a class="ai-entry" href="/assistant.html">
        <span class="ai-ico">💬</span>
        <span class="ai-txt">智能问答助手<em>对话式分析 · 可出图</em></span>
      </a>
      <nav>
        <a v-for="m in menus" :key="m.key" :class="{active: view===m.key}" @click="view=m.key">
          <span class="ico">{{ m.ico }}</span>{{ m.name }}
        </a>
      </nav>
      <div class="side-foot">选题八 · AI 数据分析与可视化<br/>Olist 电商经营决策垂直大模型</div>
    </aside>
    <main class="content">
      <header class="topbar">
        <h1>{{ currentMenu.name }}</h1>
        <span class="sub">{{ currentMenu.desc }}</span>
      </header>
      <component :is="view"></component>
    </main>
  </div>

  <script src="/assets/app.js"></script>
  <script src="/assets/ai-widget.js"></script>
</body>
</html>
