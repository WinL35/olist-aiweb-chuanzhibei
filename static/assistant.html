<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>经营决策助手 · 垂直大模型</title>
<style>
  :root{
    --bg:#0f1626; --panel:#1a2438; --panel2:#141d30;
    --accent:#2f9bff; --green:#25d4a4; --orange:#ffb547; --red:#ff6b6b;
    --txt:#e8eef7; --txt2:#93a4bf; --border:#2a3650;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  header{display:flex;align-items:center;gap:14px;padding:16px 24px;
         border-bottom:1px solid var(--border);background:var(--panel2);
         position:sticky;top:0;z-index:10;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--txt2)}
  header .back{font-size:12.5px;color:var(--txt2);text-decoration:none;padding:6px 11px;
    border:1px solid var(--border);border-radius:8px;transition:all .15s;white-space:nowrap}
  header .back:hover{color:var(--txt);border-color:var(--accent);background:rgba(56,189,248,.08)}
  .spacer{flex:1}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);
         color:var(--txt2);white-space:nowrap}
  .badge.ok{color:var(--green);border-color:#1d5a4a;background:#12291f}
  .badge.warn{color:var(--orange);border-color:#5a4a1d;background:#2a2415}
  select,button,input{font-family:inherit;font-size:13px}
  select{background:var(--panel);color:var(--txt);border:1px solid var(--border);
         border-radius:8px;padding:6px 8px}
  .wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);
        gap:16px;padding:16px 24px;max-width:1500px;margin:0 auto}
  @media(max-width:980px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px}
  /* 聊天区 */
  #chat{height:calc(100vh - 210px);min-height:420px;overflow-y:auto;padding:18px}
  .msg{margin-bottom:18px;display:flex;gap:10px}
  .msg .avatar{width:30px;height:30px;border-radius:9px;flex:0 0 30px;
               display:flex;align-items:center;justify-content:center;font-size:14px}
  .msg.user .avatar{background:#243a5e}
  .msg.bot .avatar{background:linear-gradient(135deg,#2f9bff,#25d4a4)}
  .bubble{flex:1;min-width:0}
  .who{font-size:11px;color:var(--txt2);margin-bottom:4px}
  .body-text{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
             padding:12px 14px;overflow-wrap:anywhere}
  .msg.user .body-text{background:#1c2a44}
  .body-text h4{font-size:13px;color:var(--accent);margin:12px 0 6px}
  .body-text h4:first-child{margin-top:0}
  .body-text ul{margin:4px 0;padding-left:18px}
  .body-text li{margin:2px 0}
  .body-text b{color:#fff}
  .meta{margin-top:6px;font-size:11px;color:var(--txt2);display:flex;gap:10px;flex-wrap:wrap}
  /* 反馈闭环 */
  .fb{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fb button{background:transparent;border:1px solid var(--border);color:var(--txt2);
             border-radius:14px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  .fb button:hover{border-color:var(--accent);color:#fff}
  .fb .fix{display:none;gap:6px;width:100%;margin-top:4px}
  .fb .fix input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);
                 border-radius:8px;padding:6px 9px;color:var(--txt);font-size:12px}
  .fb .fix button{background:var(--accent);border:0;color:#fff}
  .fb .done{color:var(--green);font-size:11px}
  /* 输入区 */
  .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
  .composer input{flex:1;background:var(--panel2);border:1px solid var(--border);
                  border-radius:10px;padding:11px 13px;color:var(--txt);outline:none}
  .composer input:focus{border-color:var(--accent)}
  .composer button{background:var(--accent);border:0;color:#fff;border-radius:10px;
                   padding:0 20px;font-weight:600;cursor:pointer}
  .composer button:disabled{opacity:.45;cursor:not-allowed}
  /* 右侧 */
  .side{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 210px);
        overflow-y:auto;padding-right:2px}
  .pane{padding:14px}
  .pane h3{margin:0 0 10px;font-size:12px;letter-spacing:.5px;color:var(--txt2);
           font-weight:600;text-transform:uppercase}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:5px 10px;border-radius:20px;cursor:pointer;
        background:#20304d;border:1px solid var(--border);color:#cfe0f7}
  .chip:hover{border-color:var(--accent);color:#fff}
  .step{padding:8px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;
        border-left:3px solid var(--accent);font-size:12px}
  .step.final{border-left-color:var(--green)}
  .step.bad{border-left-color:var(--red)}
  .step .n{color:var(--txt2)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
      border-bottom:1px dashed #223049;font-size:12px}
  .kv:last-child{border:0}
  .kv .k{color:var(--txt2);flex:1;min-width:0}
  .kv .v{font-variant-numeric:tabular-nums;text-align:right;color:#fff}
  .empty{color:var(--txt2);font-size:12px}
  .err{color:var(--red);font-size:12px;padding:10px;background:#2a1618;
       border:1px solid #5a2427;border-radius:8px}
  .policy{color:var(--orange);font-size:12px}
  table.eval{width:100%;border-collapse:collapse;font-size:12px}
  table.eval th,table.eval td{padding:5px 4px;border-bottom:1px solid #223049;text-align:right}
  table.eval th:first-child,table.eval td:first-child{text-align:left}
  table.eval th{color:var(--txt2);font-weight:600}
  .statusline{display:flex;gap:6px;flex-wrap:wrap}
  /* 对话内嵌图表 */
  .chat-chart{width:100%;height:340px;margin:12px 0 4px;background:var(--panel2);
              border:1px solid var(--border);border-radius:10px}
  .chart-tools{display:flex;gap:8px;margin-top:4px}
  .chart-tools button{font-size:11px;padding:2px 10px;background:var(--panel);
      border:1px solid var(--border);color:var(--txt2);border-radius:6px;cursor:pointer}
  .chart-tools button:hover{color:var(--txt);border-color:var(--accent)}
</style>
<script src="/assets/vendor/echarts.min.js"></script>
</head>
<body>
<header>
  <a class="back" href="/">← 返回看板</a>
  <h1>🧭 经营决策助手</h1>
  <span class="sub">垂直行业大模型 · 口径库 + 工具调用 + 检索</span>
  <span class="spacer"></span>
  <div class="statusline" id="status"></div>
  <select id="mode" title="消融模式（用于对比实验）">
    <option value="full">full 全量</option>
    <option value="no_tools">no_tools 无工具</option>
    <option value="no_rag">no_rag 无检索</option>
    <option value="baseline">baseline 裸底座</option>
  </select>
</header>

<div class="wrap">
  <section class="card" style="display:flex;flex-direction:column;min-width:0">
    <div id="chat"></div>
    <form class="composer" id="form">
      <input id="q" placeholder="问问经营数据，例如：美妆这个品类未来 4 周能卖多少？" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
  </section>

  <aside class="side">
    <div class="card pane">
      <h3>示例问题</h3>
      <div class="chips" id="examples"><span class="empty">加载中…</span></div>
    </div>
    <div class="card pane">
      <h3>取数轨迹</h3>
      <div id="trace"><span class="empty">还没有调用</span></div>
    </div>
    <div class="card pane">
      <h3>数据依据</h3>
      <div id="cites"><span class="empty">—</span></div>
    </div>
    <div class="card pane">
      <h3>口径与依据</h3>
      <div id="rules"><span class="empty">—</span></div>
    </div>
    <div class="card pane">
      <h3>快速评测（前 6 题）</h3>
      <div id="evalbox"><span class="empty">点下面的按钮跑一次</span></div>
      <button class="chip" id="btnEval" style="margin-top:8px">运行评测</button>
    </div>
  </aside>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 极简 markdown：加粗 + 标题（**【xx】**）+ 无序列表
function render(text){
  if(!text) return "";
  let h = esc(text);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const lines = h.split("\n");
  let out = [], inUl = false;
  for(const ln of lines){
    const t = ln.trim();
    if(!t){ if(inUl){out.push("</ul>");inUl=false;} continue; }
    if(/^- /.test(t)){
      if(!inUl){out.push("<ul>");inUl=true;}
      out.push("<li>" + t.slice(2) + "</li>");
    } else if(/^\*\*[^*]+\*\*$/.test(t) || /^<b>.*<\/b>$/.test(t)){
      if(inUl){out.push("</ul>");inUl=false;}
      out.push("<h4>" + t.replace(/<\/?b>/g,"") + "</h4>");
    } else {
      if(inUl){out.push("</ul>");inUl=false;}
      out.push("<div>" + t + "</div>");
    }
  }
  if(inUl) out.push("</ul>");
  return out.join("");
}

function addMsg(role, text, meta){
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="avatar">${role === "user" ? "我" : "AI"}</div>
    <div class="bubble">
      <div class="who">${role === "user" ? "你" : "经营决策助手"}</div>
      <div class="body-text">${render(text)}</div>
      <div class="meta">${meta || ""}</div>
    </div>`;
  $("#chat").appendChild(el);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return el;
}

function setSide(d){
  // 取数轨迹
  const tr = d.trace || [];
  if(tr.length){
    $("#trace").innerHTML = tr.map((s,i) => s.action === "tool"
      ? `<div class="step ${s.ok ? "" : "bad"}"><span class="n">#${s.step}</span> 调用 <b>${esc(s.tool)}</b>
         <div style="color:var(--txt2);font-size:11px;margin-top:2px">${esc(JSON.stringify(s.args))}</div>
         ${s.ok ? "" : `<div class="err" style="margin-top:4px">${esc(s.error||"失败")}</div>`}</div>`
      : `<div class="step final"><span class="n">#${s.step}</span> 生成回答（${s.content_chars||0} 字）</div>`
    ).join("");
  } else if(d.tools_used && d.tools_used.length){
    $("#trace").innerHTML = d.tools_used.map(t =>
      `<div class="step"><b>${esc(t)}</b><div style="color:var(--txt2);font-size:11px">离线引擎按意图自动调用</div></div>`).join("");
  } else {
    $("#trace").innerHTML = `<span class="empty">${d.mode === "no_tools" ? "no_tools 模式：未调用工具" : "未调用工具"}</span>`;
  }

  // 数据依据
  const cs = d.citations || [];
  $("#cites").innerHTML = cs.length
    ? cs.map(c => `<div class="kv"><span class="k">${esc(c["指标"])}<br><span style="opacity:.6">${esc(c["来源"])}</span></span>
        <span class="v">${esc(c["值"])}</span></div>`).join("")
    : `<span class="empty">本次回答无数字引用</span>`;

  // 口径 / 文档
  const rs = d.rules_applied || [];
  const sn = d.snippets || [];
  const ph = d.policy_hits || [];
  let h = "";
  if(ph.length) h += `<div class="policy">⚖ 口径拦截：${ph.map(esc).join("；")}</div>`;
  if(rs.length) h += rs.map(r => `<div class="kv"><span class="k">口径 ${esc(r.id)}<br>
      <span style="opacity:.6">${esc(r.topic)}</span></span></div>`).join("");
  if(sn.length) h += sn.map(s => `<div class="kv"><span class="k">《${esc(s.source)}》<br>
      <span style="opacity:.6">${esc(s.heading)}</span></span><span class="v">${s.score ?? ""}</span></div>`).join("");
  if(!h) h = `<span class="empty">未命中口径与文档片段</span>`;
  if(d.limitations && d.limitations.length)
    h += `<div class="kv"><span class="k" style="color:var(--orange)">局限</span></div>` +
         d.limitations.map(x => `<div style="font-size:11px;color:var(--txt2)">· ${esc(x)}</div>`).join("");
  $("#rules").innerHTML = h;
}

function attachFeedback(el, question, d){
  const fb = document.createElement("div");
  fb.className = "fb";
  fb.innerHTML = `<button data-v="up">👍 有用</button>
    <button data-v="down">👎 答得不对</button>
    <div class="fix"><input placeholder="哪里不对？例如：客单价应为 136.68">
      <button data-v="send">提交纠正</button></div>`;
  const payload = {question, answer: d.answer, mode: d.mode, verdict: "down", correction: ""};
  const send = async (verdict, correction) => {
    payload.verdict = verdict;
    payload.correction = correction || "";
    try{
      const r = await fetch("/api/llm/feedback", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
      });
      const j = await r.json();
      if(j.code !== 0) throw new Error(j.message || "提交失败");
      fb.innerHTML = `<span class="done">✅ 已记录 #${j.data.id}
        （规则库 ${esc(j.data.ruleset_version)}，经人工审核后进入下一轮回归）</span>`;
    }catch(e){
      fb.insertAdjacentHTML("beforeend", `<span class="err">${esc(e.message)}</span>`);
    }
  };
  fb.querySelector('[data-v="up"]').onclick = () => send("up", "");
  fb.querySelector('[data-v="down"]').onclick = () => {
    const fix = fb.querySelector(".fix");
    fix.style.display = "flex";
    fix.querySelector("input").focus();
  };
  fb.querySelector('[data-v="send"]').onclick = () =>
    send("down", fb.querySelector(".fix input").value);
  el.querySelector(".bubble").appendChild(fb);
}

// 多轮对话历史（最近 6 轮），让模型能处理「再按月拆」「那第二名呢」这类追问
const history = [];

// 把后端返回的 charts（ECharts option）渲染进气泡，并加导出按钮
function renderCharts(el, charts){
  if(!charts || !charts.length) return;
  const bubble = el.querySelector(".bubble");
  charts.forEach(opt => {
    const box = document.createElement("div");
    box.className = "chat-chart";
    bubble.appendChild(box);
    const c = echarts.init(box, null, {renderer:"canvas"});
    c.setOption(opt);
    const tools = document.createElement("div");
    tools.className = "chart-tools";
    tools.innerHTML = `<button data-a="png">导出 PNG</button><button data-a="csv">导出 CSV</button>`;
    tools.querySelector('[data-a="png"]').onclick = () => {
      const a = document.createElement("a");
      a.href = c.getDataURL({pixelRatio:2, backgroundColor:"#141d30"});
      a.download = ((opt.title && opt.title.text) || "chart") + ".png";
      a.click();
    };
    tools.querySelector('[data-a="csv"]').onclick = () => downloadCSV(opt);
    bubble.appendChild(tools);
    window.addEventListener("resize", () => c.resize());
  });
}

// 从 ECharts option 尽力提取数据导出 CSV（x 轴 + 各 series）
function downloadCSV(opt){
  const s0 = opt.series[0] || {};
  const xs = (opt.xAxis && opt.xAxis.data)
        || (s.data || []).map(d => (d && typeof d === "object") ? d.name : "")
        || [];
  const series = (opt.series || []).map(s => ({
    name: s.name || "值",
    data: (s.data || []).map(d => (d && typeof d === "object") ? d.value : d),
  }));
  let csv = "维度," + series.map(s => s.name).join(",") + "\n";
  xs.forEach((x, i) => {
    csv += `"${x}",` + series.map(s => (s.data[i] ?? "")).join(",") + "\n";
  });
  const blob = new Blob(["﻿" + csv], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ((opt.title && opt.title.text) || "data") + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function ask(text){
  if(!text.trim()) return;
  addMsg("user", text);
  $("#q").value = "";
  $("#send").disabled = true;
  const el = addMsg("bot", "思考中…");
  try{
    const r = await fetch("/api/llm/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:text, mode: $("#mode").value,
                            history: history.slice(-12)})
    });
    const j = await r.json();
    if(j.code !== 0){ throw new Error(j.message || "请求失败"); }
    const d = j.data;
    el.querySelector(".body-text").innerHTML = render(d.answer);
    renderCharts(el, d.charts || []);
    const bits = [`模式 ${d.mode}`, `置信度 ${d.confidence}`, `${d.elapsed_ms} ms`];
    if(d.provider) bits.push(d.provider === "offline" ? "离线规则引擎" : d.provider + "/" + d.model);
    if(d.refused) bits.push("已拒答");
    bits.push("数据源 " + (d.datasource || "-"));
    el.querySelector(".meta").innerHTML = bits.map(b => `<span>${esc(b)}</span>`).join("");
    attachFeedback(el, text, d);
    setSide(d);
    // 成功后把这一轮问答记入历史（供下一轮追问使用）
    history.push({role:"user", content:text});
    history.push({role:"assistant", content:d.answer || ""});
    if(history.length > 24) history.splice(0, history.length - 24);
    $("#chat").scrollTop = $("#chat").scrollHeight;
  }catch(e){
    el.querySelector(".body-text").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }finally{
    $("#send").disabled = false;
    $("#q").focus();
  }
}

$("#form").addEventListener("submit", (e) => { e.preventDefault(); ask($("#q").value); });

async function boot(){
  try{
    const h = await (await fetch("/api/llm/health")).json();
    const c = h.config || {}, k = h.knowledge || {}, t = h.tools || {};
    const st = [];
    st.push(`<span class="badge ok">口径 ${k.rules||0} 条</span>`);
    st.push(`<span class="badge ok">工具 ${t.tools_registered ?? t.tools ?? "?"} 个</span>`);
    st.push(`<span class="badge ${(k.rag&&k.rag.chunks)?"ok":"warn"}">文档 ${(k.rag&&k.rag.chunks)||0} 段</span>`);
    st.push(`<span class="badge ${c.provider==="offline"?"warn":"ok"}">底座 ${esc(c.provider||"?")}</span>`);
    st.push(`<span class="badge ok">数据源 ${esc(t.datasource||"?")}</span>`);
    $("#status").innerHTML = st.join("");
  }catch(e){
    $("#status").innerHTML = `<span class="badge warn">健康检查失败</span>`;
  }
  try{
    const ex = await (await fetch("/api/llm/examples")).json();
    const d = ex.data || {};
    $("#examples").innerHTML = Object.entries(d).map(([k,arr]) =>
      arr.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join("")
    ).join("");
    $("#examples").querySelectorAll(".chip").forEach(c =>
      c.addEventListener("click", () => ask(c.dataset.q)));
  }catch(e){ $("#examples").innerHTML = `<span class="empty">示例加载失败</span>`; }
}

$("#btnEval").addEventListener("click", async () => {
  const btn = $("#btnEval"); btn.disabled = true;
  $("#evalbox").innerHTML = `<span class="empty">运行中…</span>`;
  try{
    const j = await (await fetch("/api/llm/eval/run?limit=6&modes=baseline,full")).json();
    if(j.code !== 0) throw new Error(j.message);
    const rows = (j.data.summary || []).map(r =>
      `<tr><td>${esc(r.mode)}</td><td>${r.A ?? "-"}%</td><td>${r.B ?? "-"}%</td>
       <td>${r.C ?? "-"}%</td><td>${r.D ?? "-"}%</td><td><b>${r.acc}%</b></td></tr>`).join("");
    $("#evalbox").innerHTML = `<table class="eval">
      <tr><th>模式</th><th>A</th><th>B</th><th>C</th><th>D</th><th>总</th></tr>${rows}</table>
      <div style="font-size:11px;color:var(--txt2);margin-top:6px">
        ${j.data.simulated ? "⚠️ 离线规则引擎，数值仅反映管线有效性" : "真实底座"}</div>`;
  }catch(e){
    $("#evalbox").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }finally{ btn.disabled = false; }
});

boot();
addMsg("bot", "我是这个平台的经营决策助手。**我只用平台里的真实数据回答**，"
  + "遇到数据不支持的问题会直接说做不到。\n\n可以问我：GMV 口径、品类销量预测、选品推荐、定价建议、模型准不准。",
  "<span>建议先点右侧示例</span>");
</script>
</body>
</html>
