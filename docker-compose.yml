# 一键起「MySQL + 应用」（可选部署方式）
#
# 用法：
#   docker compose up -d              # 起库与应用
#   docker compose run --rm app python 一键导入主库.py     # 首次导数据（约 5 分钟）
#   docker compose run --rm app python 一键导入算法库.py
#   docker compose logs -f app        # 看日志
#
# 模型 key 从宿主机 .env 读取；不填则走离线确定性引擎（界面会标注 provider=offline）。

services:
  mysql:
    image: mysql:8.0
    container_name: olist-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-olist123456}
      MYSQL_DATABASE: olist_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=1
    ports:
      - "3307:3306"          # 宿主机 3307，避免与本机已装的 MySQL(3306) 冲突
    volumes:
      - olist_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-olist123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    container_name: olist-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-olist123456}
      MYSQL_DB: olist_db
      MYSQL_ALGO_DB: olist_algo_db
      # 以下三项留空即走离线引擎；想接真模型就在宿主机 .env 里填
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    volumes:
      # 数据文件不进镜像，用挂载方式提供（把 cleaned/ 放在项目根目录即可）
      - ./cleaned:/app/cleaned:ro
      - ./算法1:/app/算法1:ro
      - ./算法2:/app/算法2:ro

volumes:
  olist_mysql_data:
